
spring.application.name=pension-compliance

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SmartCompliance}
spring.datasource.username=smartcompliance_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database schema management
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Database migrations
spring.flyway.enabled=true

# Server-managed authentication session
server.servlet.session.timeout=30m

# Session cookie protection
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Enable Secure cookies in production through an environment variable.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}